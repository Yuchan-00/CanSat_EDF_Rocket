; v0.7 (v0.6.3 architecture): three ATmega128A from one source tree (SPEC 10.4 / 10.5, params.json flight_computer.architecture)
;   NAV  sensors and navigation: MPU-6050 + MS5611 on I2C, attitude estimator, altitude filter; the nlink SPI master
;        src/nav/ + core + the NAV HAL (twi, mpu6050, ms5611, nlink_spi, timer, watchdog, stack, uart_log)
;   FCU  flight control: onboard supervisor, attitude control, PWM outputs, OpenLog log; the nlink SPI slave, the
;        ilink on USART1.  src/ minus src/nav/, src/com/, the sensor drivers (twi, mpu6050, ms5611) and the radio drivers
;   COM  LoRa link: radio driver, uplink decoding, TELEM building; src/com/ + core + radio + ilink on USART0
; bare-metal C99 with avr-libc (no Arduino framework), all 16 MHz / 5 V.
; Build:   .venv/Scripts/python.exe -m platformio run -d firmware/atmega128_fc            (every default env)
;          .venv/Scripts/python.exe -m platformio run -d firmware/atmega128_fc -e fcu
; Fuses:   ... -e nav -t fuses, ... -e fcu -t fuses, ... -e com -t fuses   (USBasp, once per chip; same fuses)
; Flash:   ... -e nav -t upload   (USBasp on the NAV ISP)
;          ... -e fcu -t upload   (USBasp on the FCU ISP; unplug the OpenLog: FCU PE0/PE1 = ISP; hold the NAV in reset or
;                                  unplug the nlink connector: FCU PB1 = ISP SCK is driven by the NAV)
;          ... -e com -t upload   (USBasp on the COM ISP; unplug the ilink connector: COM PE0/PE1 = ISP)
; src/params_gen.h and src/gains.h are generated by tools/gen_firmware_params.py and tools/gen_gains_header.py.
; The COM's radio backend is params.json flight_computer.link.vehicle_radio (env com and every COM env without a
; FC_LINK_RADIO; 2026-11-06: esp_bridge, the ESP8266 Wi-Fi bridge of firmware/esp_bridge - link.radio stays the link
; MODEL of sim/link_model.py and the LoRa fallback); com_lora_uart / com_sx127x / com_esp_bridge force one backend
; each so ALL THREE always compile.  The co-simulation COMs stay lora_uart (the pessimistic link timing).
; v0.7 (SPEC 8.9, src/fc_mode.h): params.json mission.mode is a BUILD-TIME choice.  Every env without a mode suffix
; flies the mode of src/params_gen.h (MISSION_MODE; params.json v0.7: vtol) - the FCU envs pin the supervisor to it at
; compile time (tools/pio_mission_mode.py adds -D ONB_FIXED_MODE).  The *_ballistic envs build the v0.4 - v0.6.3
; climb / CUT / RELEASE mission from the same params.json (-D FC_MODE_BALLISTIC -D ONB_FIXED_MODE=LP_MODE_BALLISTIC):
; the v0.6.3 code paths of main.c / com_link.c, TELEM v1 / IL_SNAP, log format 4.
; v0.7.1: the NAV is mode-dependent too (VTOL: the gated Mahony estimator and the VTOL altitude filter; ballistic: the
; v0.6.3 estimator and filter) - nav_ballistic / nav_simbench_ballistic / nav_cosim_ballistic build -D FC_MODE_BALLISTIC.
; Build profiles (params.json mission.vtol.profiles; params_gen.h MISSION_PROFILE): the plain envs fly 'field'; the
; *_demo envs -D MISSION_PROFILE_DEMO (indoor demo: hover 1.5 m, limits 1 - 3 m, ceiling 5 m, geofence 8 m; every safety
; rule unchanged).  Only the FCU's firmware depends on the profile (the NAV's and the COM's images are byte-identical for
; field and demo - tools/run_nav_simbench.py / run_com_simbench.py check it), so a demo vehicle is fcu_demo + nav + com.
; v0.8.1 (four chips, params flight_computer.architecture_v081): the GNS board (gns / gns_demo) runs the GPS receiver,
; its filter and the position controller, whose parameters depend on the profile - a field vehicle is
; nav + gns + fcu + com, a demo vehicle nav + gns_demo + fcu_demo + com; fcu_nogps flies without a GNS board.
; v0.9 firmware round (fw09 G1, src/params_gen.h FC_VEHICLE): the vehicle constants (mixer lever arm, hover throttle,
; position-hold T/W, take-off search factor, the NAV altitude filter's 1 / u_hover, VEH_*) and FC_PARAMS_TAG belong to
; ONE vehicle configuration, so every VTOL env of every chip names it with -D FC_VCFG:
;   FC_VCFG=0  VTOL battery (cad/exports/cadquery_report_vtol.json)          the plain envs: nav, gns, fcu, com, ...
;   FC_VCFG=1  VTOL tether  (cad/exports/cadquery_report_vtol_tether.json)   *_wired        (FCU: PWR_SRC=1)
;   FC_VCFG=2  VTOL hybrid  (cad/exports/cadquery_report_vtol_hybrid.json)   *_wired_buffer (FCU: PWR_SRC=2)
; the *_ballistic envs fly the rocket (cadquery_report.json) and set no FC_VCFG.  A VTOL image without FC_VCFG does not
; compile, an FCU's PWR_SRC must equal its FC_VCFG, and the four chips of one vehicle must come from the same
; configuration (the configuration is in FC_PARAMS_TAG: the NAV and the FCU flag a mixed set).  Vehicles:
;   battery: nav + gns + fcu + com (demo: gns_demo + fcu_demo; indoors without GPS: fcu_nogps)
;   tether:  nav_wired + gns_wired + fcu_wired + com_wired           (the FCU flies without GPS: ONB_NO_GPS)
;   hybrid:  nav_wired_buffer + gns_wired_buffer + fcu_wired_buffer + com_wired_buffer

[platformio]
default_envs = nav, nav_wired, nav_wired_buffer, nav_ballistic, gns, gns_demo, gns_wired, gns_wired_buffer, fcu, fcu_demo, fcu_nogps, fcu_wired, fcu_wired_buffer, fcu_ballistic, fcu_bench_tether, fcu_bench_hover, fcu_bench_vanes, com, com_wired, com_wired_buffer, com_ballistic, com_lora_uart, com_sx127x, com_esp_bridge

[env]
platform = atmelavr
board = ATmega128
board_build.f_cpu = 16000000L
; fuses (README "퓨즈"): ext. crystal 16 MHz (CKSEL 1111, SUT 11, CKOPT on), BOD 4.0 V on,
; JTAG off, SPIEN on, EESAVE off, no boot reset vector; M103C off, WDTON off
board_fuses.lfuse = 0x3F
board_fuses.hfuse = 0xCF
board_fuses.efuse = 0xFF
upload_protocol = usbasp
upload_flags =
    -B
    8
build_unflags = -std=gnu11 -std=gnu99
build_flags =
    -std=c99
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Isrc
    -lm

; ---------------------------------------------------------------- NAV (navigation computer, v0.6.3)
; the uart_log driver is the simbench console (unused by the flight build; its UDRE vector stays in flash)
[nav_common]
build_src_filter = -<*> +<nav/> +<core/> +<hal/twi.c> +<hal/mpu6050.c> +<hal/ms5611.c> +<hal/nlink_spi.c> +<hal/timer.c> +<hal/watchdog.c> +<hal/stack.c> +<hal/uart_log.c> +<hal/glink_uart.c>
build_flags =
    ${env.build_flags}
    -D FC_ROLE_NAV
    -D GLINK_USART=1

; flight build (params.json mission.mode: vtol), VTOL battery vehicle
[env:nav]
build_src_filter = ${nav_common.build_src_filter}
build_flags =
    ${nav_common.build_flags}
    -D FC_VCFG=0

; v0.9 (fw09 G1): the NAV of the tethered vehicle (the altitude filter's thrust compensation uses its hover throttle)
[env:nav_wired]
build_src_filter = ${nav_common.build_src_filter}
build_flags =
    ${nav_common.build_flags}
    -D FC_VCFG=1

; v0.9 (fw09 G1): the NAV of the hybrid vehicle (tether + buffer battery)
[env:nav_wired_buffer]
build_src_filter = ${nav_common.build_src_filter}
build_flags =
    ${nav_common.build_flags}
    -D FC_VCFG=2

; flight build of the ballistic mission's NAV (v0.6.3 estimator and altitude filter)
[env:nav_ballistic]
build_src_filter = ${nav_common.build_src_filter}
build_flags =
    ${nav_common.build_flags}
    -D FC_MODE_BALLISTIC

; loop-time / stack measurement of the NAV alone in simavr: synthetic sensors and a synthetic FCU (nlink_spi's
; single-chip bypass, src/hal/nlink_spi.h).  Never flash.
[env:nav_simbench]
build_src_filter = ${nav_common.build_src_filter}
build_flags =
    ${nav_common.build_flags}
    -D FC_SIMBENCH
    -D FC_VCFG=0

[env:nav_simbench_ballistic]
build_src_filter = ${nav_common.build_src_filter}
build_flags =
    ${nav_common.build_flags}
    -D FC_MODE_BALLISTIC
    -D FC_SIMBENCH

; co-simulation, NAV side: synthetic sensors, the real nlink SPI master wired by a simavr harness to an fcu_cosim FCU
; (src/hal/nlink_spi.h FC_COSIM notes).  Never flash.
[env:nav_cosim]
build_src_filter = ${nav_common.build_src_filter}
build_flags =
    ${nav_common.build_flags}
    -D FC_SIMBENCH
    -D FC_COSIM
    -D FC_VCFG=0

; v0.9 (fw09 G1): the co-simulation NAVs of the tethered / hybrid vehicle (with fcu_cosim_wired / _wired_buffer,
; com_cosim_wired / _wired_buffer and gns_cosim_wired / _wired_buffer: one configuration, one FC_PARAMS_TAG).  Never flash.
[env:nav_cosim_wired]
build_src_filter = ${nav_common.build_src_filter}
build_flags =
    ${nav_common.build_flags}
    -D FC_SIMBENCH
    -D FC_COSIM
    -D FC_VCFG=1

[env:nav_cosim_wired_buffer]
build_src_filter = ${nav_common.build_src_filter}
build_flags =
    ${nav_common.build_flags}
    -D FC_SIMBENCH
    -D FC_COSIM
    -D FC_VCFG=2

[env:nav_cosim_ballistic]
build_src_filter = ${nav_common.build_src_filter}
build_flags =
    ${nav_common.build_flags}
    -D FC_MODE_BALLISTIC
    -D FC_SIMBENCH
    -D FC_COSIM

; v0.8.1: the NAV half of the NAV + GNS two-core glink harness (scratch / co-simulation): the single-chip bench's synthetic
; sensors and synthetic FCU, the REAL glink USART1 both ways (src/nav/nav_simbench.h, hal/glink_uart.h).  Never flash.
[env:nav_simbench_glink]
build_src_filter = ${nav_common.build_src_filter}
build_flags =
    ${nav_common.build_flags}
    -D FC_SIMBENCH
    -D GLINK_WIRED
    -D FC_VCFG=0

; ---------------------------------------------------------------- GNS (v0.8.1: GPS navigation + station keeping, board #4)
; params flight_computer.architecture_v081 / gns / glink, electronics.gns: the NEO-6M on USART1 (PD2 / PD3 through the
; GNS's BSS138), the glink to the NAV on USART0 (PE0 / PE1 = the ISP pins: unplug the glink to program the GNS), UBX + the
; boot configurator, the GPS filter (core/gps_nav.h) and the position controller (core/position_ctrl.h) at 50 Hz
; (core/gns_node.h, src/gns/gns_main.c).  The position controller's parameters depend on the build profile
; (mission.vtol.profiles: field / demo), so the GNS has a demo image like the FCU: a demo vehicle is
; nav + gns_demo + fcu_demo + com, a field vehicle nav + gns + fcu + com.
;   ... -e gns -t upload   (USBasp on the GNS ISP; unplug the glink connector: GNS PE0/PE1 = ISP)
[gns_common]
build_src_filter = -<*> +<gns/> +<core/> +<nav/nav_timer.c> +<hal/timer.c> +<hal/watchdog.c> +<hal/stack.c> +<hal/gps_uart.c> +<hal/glink_uart.c>
build_flags =
    ${env.build_flags}
    -D FC_ROLE_GNS
    -D GLINK_USART=0

[env:gns]
build_src_filter = ${gns_common.build_src_filter}
build_flags =
    ${gns_common.build_flags}
    -D FC_VCFG=0

[env:gns_demo]
build_src_filter = ${gns_common.build_src_filter}
build_flags =
    ${gns_common.build_flags}
    -D MISSION_PROFILE_DEMO
    -D FC_VCFG=0

; v0.9 (fw09 G1): the GNS of the tethered / hybrid vehicle (the position controller's T/W is the vehicle's).  The power
; builds' FCU flies without GPS (fcu_wired / fcu_wired_buffer: ONB_NO_GPS); these images keep a fitted GNS board consistent
; with the vehicle (the NAV's glink and the tag) and are ready for a tethered GPS build.
[env:gns_wired]
build_src_filter = ${gns_common.build_src_filter}
build_flags =
    ${gns_common.build_flags}
    -D FC_VCFG=1

[env:gns_wired_buffer]
build_src_filter = ${gns_common.build_src_filter}
build_flags =
    ${gns_common.build_flags}
    -D FC_VCFG=2

; loop-time / stack measurement of the GNS alone in simavr: a synthetic NAV on the glink (bypass, Timer1 compare
; injection), a synthetic NEO-6M on USART1 (Timer3 bench wire), the console on USART0 (src/gns/gns_simbench.h):
;   .venv/Scripts/python.exe firmware/atmega128_fc/tools/run_gns_simbench.py
; never flash these builds
[env:gns_simbench]
build_src_filter = ${gns_common.build_src_filter} +<hal/uart_log.c>
build_flags =
    ${gns_common.build_flags}
    -D FC_SIMBENCH
    -D FC_VCFG=0

[env:gns_simbench_demo]
build_src_filter = ${gns_common.build_src_filter} +<hal/uart_log.c>
build_flags =
    ${gns_common.build_flags}
    -D MISSION_PROFILE_DEMO
    -D FC_SIMBENCH
    -D FC_VCFG=0

; co-simulation / two-core harness, GNS side: the synthetic NEO-6M, the REAL glink USART0 (a simavr harness wires a NAV to
; it), no console (the RAM struct g_gns_cosim_report).  Never flash.
[env:gns_cosim]
build_src_filter = ${gns_common.build_src_filter}
build_flags =
    ${gns_common.build_flags}
    -D FC_SIMBENCH
    -D FC_COSIM
    -D FC_VCFG=0

; v0.9 (fw09 G1): the co-simulation GNS of the tethered / hybrid vehicle.  Never flash.
[env:gns_cosim_wired]
build_src_filter = ${gns_common.build_src_filter}
build_flags =
    ${gns_common.build_flags}
    -D FC_SIMBENCH
    -D FC_COSIM
    -D FC_VCFG=1

[env:gns_cosim_wired_buffer]
build_src_filter = ${gns_common.build_src_filter}
build_flags =
    ${gns_common.build_flags}
    -D FC_SIMBENCH
    -D FC_COSIM
    -D FC_VCFG=2

; ---------------------------------------------------------------- FCU (flight control unit)
[fcu_common]
build_src_filter = +<*> -<com/> -<nav/> -<gns/> -<hal/lora_uart.c> -<hal/sx127x.c> -<hal/esp_bridge.c> -<hal/twi.c> -<hal/mpu6050.c> -<hal/ms5611.c> -<hal/gps_uart.c> -<hal/glink_uart.c>
build_flags =
    ${env.build_flags}
    -D FC_ROLE_FCU
    -D ILINK_USART=1
extra_scripts = pre:tools/pio_mission_mode.py
; the mode pin of the *_ballistic FCU envs
ballistic_flags =
    -D FC_MODE_BALLISTIC
    -D ONB_FIXED_MODE=LP_MODE_BALLISTIC

; flight build (params.json mission.mode)
[env:fcu]
build_src_filter = ${fcu_common.build_src_filter}
build_flags =
    ${fcu_common.build_flags}
    -D FC_VCFG=0
extra_scripts = ${fcu_common.extra_scripts}

; flight build, VTOL profile 'demo' (params.json mission.vtol.profiles.demo: the indoor push demonstration)
[env:fcu_demo]
build_src_filter = ${fcu_common.build_src_filter}
extra_scripts = ${fcu_common.extra_scripts}
build_flags =
    ${fcu_common.build_flags}
    -D MISSION_PROFILE_DEMO
    -D FC_VCFG=0

; flight build of the ballistic mission (v0.6.3 behaviour) from the same params.json
[env:fcu_ballistic]
build_src_filter = ${fcu_common.build_src_filter}
build_flags =
    ${fcu_common.build_flags}
    ${fcu_common.ballistic_flags}

; v0.8: the VTOL flight build WITHOUT GPS position hold (-D ONB_NO_GPS; core/onboard.h): the indoor fallback - GPS needs
; open sky, so there is no position hold indoors.  Attitude-only hover as v0.7.1 (nlink v3 frames from the same nav image,
; SNAP2 -> TELEM v2 through the same com image, log format 6).  fcu_simbench_nogps measures it.
[env:fcu_nogps]
build_src_filter = ${fcu_common.build_src_filter}
extra_scripts = ${fcu_common.extra_scripts}
build_flags =
    ${fcu_common.build_flags}
    -D ONB_NO_GPS
    -D FC_VCFG=0

; v0.9 power builds (core/power_mon.h; params power.source tether / hybrid = the tether report's wired / wired_buffer):
; the indoor tethered vehicle flies without the GPS (ONB_NO_GPS); the tethered limits and the power rules are build
; constants (src/params_gen.h PWR_* / ONB_W_*).  Not the mechanical fcu_bench_tether (a throttle-limited bench build).
; fw09 G1: FC_VCFG = PWR_SRC (the tethered / hybrid vehicle's constants; params_gen.h refuses a mismatch).
[env:fcu_wired]
build_src_filter = ${fcu_common.build_src_filter}
extra_scripts = ${fcu_common.extra_scripts}
build_flags =
    ${fcu_common.build_flags}
    -D ONB_NO_GPS
    -D PWR_SRC=1
    -D FC_VCFG=1

[env:fcu_wired_buffer]
build_src_filter = ${fcu_common.build_src_filter}
extra_scripts = ${fcu_common.extra_scripts}
build_flags =
    ${fcu_common.build_flags}
    -D ONB_NO_GPS
    -D PWR_SRC=2
    -D FC_VCFG=2

[env:fcu_simbench_wired]
build_src_filter = ${fcu_common.build_src_filter}
extra_scripts = ${fcu_common.extra_scripts}
build_flags =
    ${fcu_common.build_flags}
    -D ONB_NO_GPS
    -D PWR_SRC=1
    -D FC_SIMBENCH
    -D FC_VCFG=1

[env:fcu_simbench_wired_buffer]
build_src_filter = ${fcu_common.build_src_filter}
extra_scripts = ${fcu_common.extra_scripts}
build_flags =
    ${fcu_common.build_flags}
    -D ONB_NO_GPS
    -D PWR_SRC=2
    -D FC_SIMBENCH
    -D FC_VCFG=2

; tethered thrust test on the load cell: same firmware, ESC throttle capped at 50 % (the fcu_bench_* builds are the
; battery vehicle's, FC_VCFG=0)
[env:fcu_bench_tether]
build_src_filter = ${fcu_common.build_src_filter}
extra_scripts = ${fcu_common.extra_scripts}
build_flags =
    ${fcu_common.build_flags}
    -D FC_THROTTLE_LIMIT=0.5f
    -D FC_VCFG=0

; tethered hover: ESC throttle capped at the hover throttle (params_gen FC_HOVER_THROTTLE, from the CAD mass) + 5 %
[env:fcu_bench_hover]
build_src_filter = ${fcu_common.build_src_filter}
extra_scripts = ${fcu_common.extra_scripts}
build_flags =
    ${fcu_common.build_flags}
    -D FC_THROTTLE_LIMIT_HOVER_MARGIN=0.05f
    -D FC_VCFG=0

; vane direction / trim check (README 9.3): in SAFE with the arm plug OUT and the NAV's estimator aligned, the
; attitude controller drives the vanes at the hover-throttle gains; the ESC never leaves its off pulse.
; Never fly this build.
[env:fcu_bench_vanes]
build_src_filter = ${fcu_common.build_src_filter}
extra_scripts = ${fcu_common.extra_scripts}
build_flags =
    ${fcu_common.build_flags}
    -D FC_BENCH_VANES
    -D FC_VCFG=0

; loop-time / stack measurement of the FCU alone in the simavr ATmega128 simulator (a synthetic NAV through nlink_spi's
; single-chip bypass and a synthetic COM on the ilink, see src/simbench.h):
;   .venv/Scripts/python.exe firmware/atmega128_fc/tools/run_simbench.py
; never flash these builds into the vehicle
[env:fcu_simbench]
build_src_filter = ${fcu_common.build_src_filter}
extra_scripts = ${fcu_common.extra_scripts}
build_flags =
    ${fcu_common.build_flags}
    -D FC_SIMBENCH
    -D FC_VCFG=0

; v0.8: the simbench of the VTOL build without GPS position hold (fcu_nogps)
[env:fcu_simbench_nogps]
build_src_filter = ${fcu_common.build_src_filter}
extra_scripts = ${fcu_common.extra_scripts}
build_flags =
    ${fcu_common.build_flags}
    -D ONB_NO_GPS
    -D FC_SIMBENCH
    -D FC_VCFG=0

; the same plus per-operation cycle counts printed at boot (SBM lines); its stack figure includes the benchmark
[env:fcu_simbench_micro]
build_src_filter = ${fcu_common.build_src_filter}
extra_scripts = ${fcu_common.extra_scripts}
build_flags =
    ${fcu_common.build_flags}
    -D FC_SIMBENCH
    -D FC_SIMBENCH_MICRO
    -D FC_VCFG=0

; the demo profile's simbench (run_simbench.py --profile demo): the same VTOL loop with the demo targets / limits
[env:fcu_simbench_demo]
build_src_filter = ${fcu_common.build_src_filter}
extra_scripts = ${fcu_common.extra_scripts}
build_flags =
    ${fcu_common.build_flags}
    -D MISSION_PROFILE_DEMO
    -D FC_SIMBENCH
    -D FC_VCFG=0

; the two simbench builds of the ballistic mission (run_simbench.py --mode ballistic)
[env:fcu_simbench_ballistic]
build_src_filter = ${fcu_common.build_src_filter}
build_flags =
    ${fcu_common.build_flags}
    ${fcu_common.ballistic_flags}
    -D FC_SIMBENCH

[env:fcu_simbench_micro_ballistic]
build_src_filter = ${fcu_common.build_src_filter}
build_flags =
    ${fcu_common.build_flags}
    ${fcu_common.ballistic_flags}
    -D FC_SIMBENCH
    -D FC_SIMBENCH_MICRO

; co-simulation, FCU side: the real ilink USART1 (no synthetic COM) wired by a simavr harness to a com_cosim /
; com_cosim_sx127x COM, and the real nlink SPI slave (FC_COSIM) for a nav_cosim NAV.  Same run length as the COM's
; synthetic ground (src/com/com_simbench.h COM_SB_SECONDS = 15 s).  Never flash.
[env:fcu_cosim]
build_src_filter = ${fcu_common.build_src_filter}
extra_scripts = ${fcu_common.extra_scripts}
build_flags =
    ${fcu_common.build_flags}
    -D FC_SIMBENCH
    -D FC_COSIM
    -D FC_SIMBENCH_SECONDS=15
    -D FC_VCFG=0

[env:fcu_cosim_ballistic]
build_src_filter = ${fcu_common.build_src_filter}
build_flags =
    ${fcu_common.build_flags}
    ${fcu_common.ballistic_flags}
    -D FC_SIMBENCH
    -D FC_COSIM
    -D FC_SIMBENCH_SECONDS=15

; v0.7.1: the co-simulation FCU of the demo profile (run_cosim.py --profile demo; with nav_cosim and com_cosim / com_cosim_sx127x,
; whose images do not depend on the profile).  Never flash.
[env:fcu_cosim_demo]
build_src_filter = ${fcu_common.build_src_filter}
extra_scripts = ${fcu_common.extra_scripts}
build_flags =
    ${fcu_common.build_flags}
    -D MISSION_PROFILE_DEMO
    -D FC_SIMBENCH
    -D FC_COSIM
    -D FC_SIMBENCH_SECONDS=15
    -D FC_VCFG=0

; v0.9 (fw09 G1): the co-simulation FCUs of the power builds (fcu_wired / fcu_wired_buffer; with nav_cosim_wired /
; _wired_buffer, com_cosim_wired / _wired_buffer, gns_cosim_wired / _wired_buffer).  Never flash.
[env:fcu_cosim_wired]
build_src_filter = ${fcu_common.build_src_filter}
extra_scripts = ${fcu_common.extra_scripts}
build_flags =
    ${fcu_common.build_flags}
