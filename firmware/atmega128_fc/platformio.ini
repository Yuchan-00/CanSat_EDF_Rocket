; The rocket's flight computer (v0.6.3 architecture): three ATmega128A from one source tree (SPEC 10.4 / 10.5, params.json
; flight_computer.architecture)
;   NAV  sensors and navigation: MPU-6050 + barometer (BMP280; MS5611 build option) on I2C, attitude estimator, altitude
;        filter; the nlink SPI master.  src/nav/ + core + the NAV HAL
;   FCU  flight control: onboard supervisor, attitude control, PWM outputs, OpenLog log; the nlink SPI slave, the
;        ilink on USART1.  src/ minus src/nav/, src/com/, the sensor drivers and the radio drivers
;   COM  radio link (ESP-12E bridge by default, LoRa fallback): radio driver, uplink decoding, TELEM building; src/com/ + core
;        + radio + ilink on USART0
; bare-metal C99 with avr-libc (no Arduino framework), all 16 MHz / 5 V.
; Build:   .venv/Scripts/python.exe -m platformio run -d firmware/atmega128_fc            (every default env)
;          .venv/Scripts/python.exe -m platformio run -d firmware/atmega128_fc -e fcu_ballistic
; Fuses:   ... -e nav_ballistic -t fuses, ... -e fcu_ballistic -t fuses, ... -e com_ballistic -t fuses   (USBasp, once per chip)
; Flash:   ... -e nav_ballistic -t upload   (USBasp on the NAV ISP)
;          ... -e fcu_ballistic -t upload   (USBasp on the FCU ISP; unplug the OpenLog: FCU PE0/PE1 = ISP; hold the NAV in
;                                            reset or unplug the nlink connector: FCU PB1 = ISP SCK is driven by the NAV)
;          ... -e com_ballistic -t upload   (USBasp on the COM ISP; unplug the ilink connector: COM PE0/PE1 = ISP)
; src/params_gen.h and src/gains.h are generated by tools/gen_firmware_params.py and tools/gen_gains_header.py.
; The mission (params.json mission.mode 'ballistic', src/fc_mode.h) is the rocket's climb / CUT / RELEASE program; every
; env builds it with -D FC_MODE_BALLISTIC (the FCU envs also -D ONB_FIXED_MODE=LP_MODE_BALLISTIC) - the env names keep the
; '_ballistic' suffix so the images, hashes and tools of earlier rounds stay comparable.
; The COM's radio backend is params.json flight_computer.link.vehicle_radio (com_ballistic; 2026-11-06: esp_bridge, the
; ESP8266 Wi-Fi bridge of firmware/esp_bridge); com_lora_uart_ballistic / com_sx127x_ballistic / com_esp_bridge_ballistic
; force one backend each so ALL THREE always compile.  The co-simulation COMs stay lora_uart (the pessimistic link timing).
; Ground bring-up (never fly): fcu_bench_vanes (vane direction / trim), fcu_bench_tether (thrust test, 50 % cap),
; fcu_bench_hover (tethered hover, hover throttle + 5 % cap) - FCU only, the NAV and the COM keep their flight builds.

[platformio]
default_envs = nav_ballistic, fcu_ballistic, fcu_bench_vanes, fcu_bench_tether, fcu_bench_hover, com_ballistic, com_lora_uart_ballistic, com_sx127x_ballistic, com_esp_bridge_ballistic


[env]
platform = atmelavr
board = ATmega128
board_build.f_cpu = 16000000L
; fuses (README "퓨즈"): ext. crystal 16 MHz (CKSEL 1111, SUT 11, CKOPT on), BOD 4.0 V on,
; JTAG off, SPIEN on, EESAVE off, no boot reset vector; M103C off, WDTON off
board_fuses.lfuse = 0x3F
board_fuses.hfuse = 0xCF
board_fuses.efuse = 0xFF
upload_protocol = usbasp
upload_flags =
    -B
    8
build_unflags = -std=gnu11 -std=gnu99
build_flags =
    -std=c99
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Isrc
    -lm


; ---------------------------------------------------------------- NAV (navigation computer, v0.6.3)
; the uart_log driver is the simbench console (unused by the flight build; its UDRE vector stays in flash)
[nav_common]
build_src_filter = -<*> +<nav/> +<core/> +<hal/twi.c> +<hal/mpu6050.c> +<hal/bmp280.c> +<hal/ms5611.c> +<hal/nlink_spi.c> +<hal/timer.c> +<hal/watchdog.c> +<hal/stack.c> +<hal/uart_log.c>
build_flags =
    ${env.build_flags}
    -D FC_ROLE_NAV


; flight build of the ballistic mission's NAV (v0.6.3 estimator and altitude filter)
[env:nav_ballistic]
build_src_filter = ${nav_common.build_src_filter}
build_flags =
    ${nav_common.build_flags}
    -D FC_MODE_BALLISTIC


[env:nav_simbench_ballistic]
build_src_filter = ${nav_common.build_src_filter}
build_flags =
    ${nav_common.build_flags}
    -D FC_MODE_BALLISTIC
    -D FC_SIMBENCH


[env:nav_cosim_ballistic]
build_src_filter = ${nav_common.build_src_filter}
build_flags =
    ${nav_common.build_flags}
    -D FC_MODE_BALLISTIC
    -D FC_SIMBENCH
    -D FC_COSIM


; ---------------------------------------------------------------- FCU (flight control unit)
[fcu_common]
build_src_filter = +<*> -<com/> -<nav/> -<hal/lora_uart.c> -<hal/sx127x.c> -<hal/esp_bridge.c> -<hal/twi.c> -<hal/mpu6050.c> -<hal/bmp280.c> -<hal/ms5611.c>
build_flags =
    ${env.build_flags}
    -D FC_ROLE_FCU
    -D ILINK_USART=1
; the mode pin of the *_ballistic FCU envs
ballistic_flags =
    -D FC_MODE_BALLISTIC
    -D ONB_FIXED_MODE=LP_MODE_BALLISTIC


; flight build of the ballistic mission (v0.6.3 behaviour) from the same params.json
[env:fcu_ballistic]
build_src_filter = ${fcu_common.build_src_filter}
build_flags =
    ${fcu_common.build_flags}
    ${fcu_common.ballistic_flags}


; the rocket's ground bring-up builds (README 9.3 and 10 steps 5 / 9 / 10, docs/시험_안전_법규.md stages 1 - 3): the
; flight build fcu_ballistic + one bench option each.  NAV and COM stay on their flight builds.  Never fly these.
; vane direction / trim check (README 9.3): in SAFE with the arm plug OUT and the NAV's estimator aligned, the
; attitude controller drives the vanes at the hover-throttle gains (FC_HOVER_THROTTLE); the ESC never leaves its off
; pulse.  The FCU sends NL_FF_BENCH (the NAV's estimator stays gyro-only), the LED blinks slowly, the log sets LOG_F_BENCH.
[env:fcu_bench_vanes]
build_src_filter = ${fcu_common.build_src_filter}
build_flags =
    ${fcu_common.build_flags}
    ${fcu_common.ballistic_flags}
    -D FC_BENCH_VANES

; load-cell thrust test, 0 - 50 % part (README 10 step 9): same firmware, ESC throttle capped at 50 % (the 50 - 100 %
; part is the flight build with the ground station's throttle command)
[env:fcu_bench_tether]
build_src_filter = ${fcu_common.build_src_filter}
build_flags =
    ${fcu_common.build_flags}
    ${fcu_common.ballistic_flags}
    -D FC_THROTTLE_LIMIT=0.5f

; tethered / gimbal hover (README 10 step 10, test-plan stage 3): ESC throttle capped at the rocket's hover throttle
; (params_gen FC_HOVER_THROTTLE) + 5 %.  The header still holds the old body's value (0.917, 2.5992 kg, e4fcf73); it is
; regenerated from the new body's CAD (about 0.936, 2.7056 kg) with the control round - check it before a hover test.
[env:fcu_bench_hover]
build_src_filter = ${fcu_common.build_src_filter}
build_flags =
    ${fcu_common.build_flags}
    ${fcu_common.ballistic_flags}
    -D FC_THROTTLE_LIMIT_HOVER_MARGIN=0.05f


; the two simbench builds of the ballistic mission (run_simbench.py --mode ballistic)
[env:fcu_simbench_ballistic]
build_src_filter = ${fcu_common.build_src_filter}
build_flags =
    ${fcu_common.build_flags}
    ${fcu_common.ballistic_flags}
    -D FC_SIMBENCH


[env:fcu_simbench_micro_ballistic]
build_src_filter = ${fcu_common.build_src_filter}
build_flags =
    ${fcu_common.build_flags}
    ${fcu_common.ballistic_flags}
    -D FC_SIMBENCH
    -D FC_SIMBENCH_MICRO


[env:fcu_cosim_ballistic]
build_src_filter = ${fcu_common.build_src_filter}
build_flags =
    ${fcu_common.build_flags}
    ${fcu_common.ballistic_flags}
    -D FC_SIMBENCH
    -D FC_COSIM
    -D FC_SIMBENCH_SECONDS=15


; ---------------------------------------------------------------- COM (radio link processor: ESP bridge / LoRa)
[com_common]
build_src_filter = -<*> +<com/> +<core/> +<hal/ilink_uart.c> +<hal/lora_uart.c> +<hal/sx127x.c> +<hal/esp_bridge.c> +<hal/watchdog.c> +<hal/stack.c>
build_flags =
    ${env.build_flags}
    -D FC_ROLE_COM
    -D ILINK_USART=0


; the ballistic mission's COM (IL_SNAP -> TELEM v1): the radio named in params.json, and each backend
[env:com_ballistic]
build_src_filter = ${com_common.build_src_filter}
build_flags =
    ${com_common.build_flags}
    -D FC_MODE_BALLISTIC


[env:com_lora_uart_ballistic]
build_src_filter = ${com_common.build_src_filter}
build_flags =
    ${com_common.build_flags}
    -D FC_MODE_BALLISTIC
    -D FC_LINK_RADIO=FC_RADIO_LORA_UART


[env:com_sx127x_ballistic]
build_src_filter = ${com_common.build_src_filter}
build_flags =
    ${com_common.build_flags}
    -D FC_MODE_BALLISTIC
    -D FC_LINK_RADIO=FC_RADIO_SX127X


[env:com_esp_bridge_ballistic]
build_src_filter = ${com_common.build_src_filter}
build_flags =
    ${com_common.build_flags}
    -D FC_MODE_BALLISTIC
    -D FC_LINK_RADIO=FC_RADIO_ESP_BRIDGE


; the ballistic mission's COM benches (run_com_simbench.py --mode ballistic)
[env:com_simbench_ballistic]
build_src_filter = ${com_common.build_src_filter}
build_flags =
    ${com_common.build_flags}
    -D FC_MODE_BALLISTIC
    -D FC_SIMBENCH
    -D FC_LINK_RADIO=FC_RADIO_LORA_UART


[env:com_simbench_sx127x_ballistic]
build_src_filter = ${com_common.build_src_filter}
build_flags =
    ${com_common.build_flags}
    -D FC_MODE_BALLISTIC
    -D FC_SIMBENCH
    -D FC_LINK_RADIO=FC_RADIO_SX127X


[env:com_simbench_esp_ballistic]
build_src_filter = ${com_common.build_src_filter}
build_flags =
    ${com_common.build_flags}
    -D FC_MODE_BALLISTIC
    -D FC_SIMBENCH
    -D FC_LINK_RADIO=FC_RADIO_ESP_BRIDGE


; the co-simulation COMs of the ballistic mission (with fcu_cosim_ballistic)
[env:com_cosim_ballistic]
build_src_filter = ${com_common.build_src_filter}
build_flags =
    ${com_common.build_flags}
    -D FC_MODE_BALLISTIC
    -D FC_SIMBENCH
    -D FC_COSIM
    -D FC_LINK_RADIO=FC_RADIO_LORA_UART


[env:com_cosim_sx127x_ballistic]
build_src_filter = ${com_common.build_src_filter}
build_flags =
    ${com_common.build_flags}
    -D FC_MODE_BALLISTIC
    -D FC_SIMBENCH
    -D FC_COSIM
    -D FC_LINK_RADIO=FC_RADIO_SX127X
