; ---------------------------------------------------------------- v0.9 closed-loop four-core co-simulation (fw09 WP-S)
; tools/run_cosim4.py: NAV nav_cosim_twi + GNS gns_cosim_cl[_demo] + FCU fcu_cosim_cl[_demo|_nogps] + COM com_cosim_cl
; (battery vehicle, FC_VCFG=0), and the tethered / hybrid sets nav_cosim_twi_wired[_buffer] + gns_cosim_cl_wired[_buffer]
; + fcu_cosim_cl_wired[_buffer] + com_cosim_cl_wired[_buffer] (fw09 G1: one configuration, one FC_PARAMS_TAG per run;
; the FCU's PWR_SRC = its FC_VCFG).  The plant is in the harness (tools/cosim/plant4.c).  52 s runs (the field profile:
; ON, CLIMB, HOLD with DOWN / UP, OFF, LAND, LANDED, SAFE).  Never flash.
; NAV: nav_cosim with the REAL MPU-6050 / MS5611 drivers on the TWI (src/nav/nav_simbench.h NAV_SB_TWI; the harness's
; tools/cosim/twi_models.c answers them) and its Timer0 IMU lead
