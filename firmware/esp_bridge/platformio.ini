; ESP8266 UART <-> ESP-NOW bridge (README.md): one sketch, two roles.
;   vehicle_esp12e  the ESP-12E on the VTOL carrier (U7, J3 flash header) or on the rocket's COM board
;   ground_esp07s   the ground module (ESP-07S class, external antenna) on a 3.3 V USB-UART
; Settings: src/esp_bridge_config_gen.h, generated from params.json flight_computer.link.esp_bridge before every build
; (extra_gen.py -> gen_esp_bridge_config.py).
;
; NOT BUILT WITH PLATFORMIO ON THIS PC (2026-11-06): the PlatformIO platform espressif8266 is not installed.  The sketch
; IS compiled with arduino-cli and the Arduino core esp8266:esp8266 3.1.2 instead: build_arduino_cli.py (5 role / flag
; variants, all exit 0, no warnings in the bridge source; README.md "빌드").  The portable part (src/bridge_core.*) is also
; host-tested: tools/test_esp_bridge.py.
;
; Build:  .venv/Scripts/python.exe -m platformio run -d firmware/esp_bridge
; Flash:  ... -e vehicle_esp12e -t upload --upload-port COMx   (J3: shunt IO0-GND, COM held in reset by J26, see README)
;         ... -e ground_esp07s -t upload --upload-port COMy

[platformio]
default_envs = vehicle_esp12e, ground_esp07s

[env]
platform = espressif8266
framework = arduino
upload_speed = 115200
monitor_speed = 38400
extra_scripts = pre:extra_gen.py
build_src_flags =
    -Wall
    -Wextra

[env:vehicle_esp12e]
board = esp12e
build_flags = -D BRIDGE_ROLE_VEHICLE

[env:ground_esp07s]
board = esp07s
build_flags = -D BRIDGE_ROLE_GROUND
