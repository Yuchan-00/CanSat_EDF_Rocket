; USB <-> LoRa ground bridge for an SX1276-class module (SPEC 10.3, sx127x backend).
; Arduino Nano (ATmega328P, 5 V, 16 MHz) + sandeepmistry LoRa library; byte-transparent: the bytes the
; ground station writes go on air unchanged, received packets come back unchanged.
; Radio settings and the serial baud: src/bridge_config_gen.h, generated from params.json before every build
; (extra_gen.py -> gen_bridge_config.py). Wiring: README.md and docs/지상국_사용법.md.
;
; Build:  .venv/Scripts/python.exe -m platformio run -d firmware/ground_bridge
; Flash:  .venv/Scripts/python.exe -m platformio run -d firmware/ground_bridge -e nano -t upload --upload-port COM7
;         (clone with the old bootloader: -e nano_oldboot;  Arduino Uno: -e uno)

[platformio]
default_envs = nano

[env]
platform = atmelavr
framework = arduino
lib_deps =
    sandeepmistry/LoRa@0.8.0
extra_scripts = pre:extra_gen.py
; warnings for the bridge source only (the Arduino core and the library are not ours)
build_src_flags =
    -Wall
    -Wextra

; Arduino Nano, current bootloader (upload 115200)
[env:nano]
board = nanoatmega328new

; Arduino Nano clones with the old bootloader (upload 57600)
[env:nano_oldboot]
board = nanoatmega328

; Arduino Uno (same pins)
[env:uno]
board = uno
